[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drugagent"
version = "0.1.0"
description = "AgentCore Runtime Application using Strands SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore >= 1.0.3",
    "botocore[crt] >= 1.35.0",
    "mcp >= 1.19.0",
    "strands-agents[otel]>=1.13.0",
    # Async HTTP. Replaces `requests`: sync calls inside the async
    # entrypoint block the event loop and serialise every request.
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    # OpenTelemetry
    "opentelemetry-api>=1.36.0",
    "opentelemetry-sdk>=1.36.0",
    "opentelemetry-exporter-otlp-proto-http>=1.36.0",
    "opentelemetry-semantic-conventions>=0.57b0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
# Legacy modules awaiting removal (see docs/implementation-plan.md step 0).
# Excluded rather than fixed: linting code that is about to be deleted
# produces a clean diff for files nobody will read again.
exclude = [
    "agents",
    "mcp_client",
    "orchestrator",
    "prompts",
    "services",
    "tools",
]

[tool.pytest.ini_options]
# Tests import `clients`, `config`, `domain` as top-level modules, the
# same way the deployed entrypoint does. Rooting pytest here keeps the
# import path identical between test and runtime.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "smoke: hits a real public API over the network (deselect with -m 'not smoke')",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
